<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1F35" />
      <stop offset="50%" stop-color="#0E2847" />
      <stop offset="100%" stop-color="#071426" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer card background -->
  <rect width="400" height="480" rx="24" fill="url(#bg)" stroke="#22D3EE" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <!-- Subtle tech grid -->
  <g opacity="0.12" stroke="#22D3EE" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="480"/>
    <line x1="120" y1="0" x2="120" y2="480"/>
    <line x1="200" y1="0" x2="200" y2="480"/>
    <line x1="280" y1="0" x2="280" y2="480"/>
    <line x1="360" y1="0" x2="360" y2="480"/>
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="320" x2="400" y2="320"/>
    <line x1="0" y1="400" x2="400" y2="400"/>
  </g>

  <!-- Glowing background aura -->
  <circle cx="200" cy="180" r="90" fill="#22D3EE" opacity="0.15" filter="url(#softGlow)"/>

  <!-- Geometric avatar rings -->
  <circle cx="200" cy="180" r="85" fill="none" stroke="url(#cyanGlow)" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="200" cy="180" r="75" fill="#071426" stroke="#38BDF8" stroke-width="1.5"/>

  <!-- Professional Avatar Silhouette -->
  <!-- Head & Hair -->
  <path d="M165 170 C165 130, 235 130, 235 170 C235 200, 220 215, 200 215 C180 215, 165 200, 165 170 Z" fill="#38BDF8" opacity="0.9"/>
  <!-- Hair style overlay -->
  <path d="M160 160 C160 120, 240 120, 240 160 C240 175, 232 185, 228 175 C222 150, 178 150, 172 175 C168 185, 160 175, 160 160 Z" fill="#0B1F35"/>
  <!-- Shoulders & Torso -->
  <path d="M125 290 C125 240, 165 230, 200 230 C235 230, 275 240, 275 290 L125 290 Z" fill="url(#accentGrad)" stroke="#22D3EE" stroke-width="1.5"/>

  <!-- Badges / Labels -->
  <rect x="70" y="330" width="260" height="42" rx="10" fill="#0B1F35" stroke="#22D3EE" stroke-opacity="0.5" stroke-width="1"/>
  <circle cx="92" cy="351" r="5" fill="#22D3EE" filter="url(#softGlow)"/>
  <text x="110" y="356" fill="#F1F5F9" font-family="'Inter', sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">Ann Maria Sunil</text>
  
  <rect x="90" y="385" width="220" height="28" rx="14" fill="#071426" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1"/>
  <text x="200" y="403" text-anchor="middle" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11" font-weight="500">B.Tech CSE • Amal Jyothi</text>

  <!-- Corner tech brackets -->
  <path d="M 20 40 L 20 20 L 40 20" fill="none" stroke="#22D3EE" stroke-width="2"/>
  <path d="M 380 40 L 380 20 L 360 20" fill="none" stroke="#22D3EE" stroke-width="2"/>
  <path d="M 20 440 L 20 460 L 40 460" fill="none" stroke="#22D3EE" stroke-width="2"/>
  <path d="M 380 440 L 380 460 L 360 460" fill="none" stroke="#22D3EE" stroke-width="2"/>
</svg>

