<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380">
  <defs>
    <linearGradient id="p1bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1F35"/>
      <stop offset="100%" stop-color="#071426"/>
    </linearGradient>
    <linearGradient id="p1accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="p1glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" rx="16" fill="url(#p1bg)"/>
  
  <!-- Subtle decorative grid -->
  <g opacity="0.08" stroke="#22D3EE" stroke-width="1">
    <line x1="0" y1="95" x2="600" y2="95"/>
    <line x1="0" y1="190" x2="600" y2="190"/>
    <line x1="0" y1="285" x2="600" y2="285"/>
    <line x1="150" y1="0" x2="150" y2="380"/>
    <line x1="300" y1="0" x2="300" y2="380"/>
    <line x1="450" y1="0" x2="450" y2="380"/>
  </g>

  <!-- Browser window frame mockup -->
  <g transform="translate(40, 35)">
    <rect width="520" height="310" rx="12" fill="#061220" stroke="#22D3EE" stroke-width="1.2" stroke-opacity="0.3"/>
    
    <!-- Window controls -->
    <circle cx="25" cy="22" r="5" fill="#EF4444" opacity="0.8"/>
    <circle cx="42" cy="22" r="5" fill="#F59E0B" opacity="0.8"/>
    <circle cx="59" cy="22" r="5" fill="#10B981" opacity="0.8"/>
    <rect x="90" y="14" width="280" height="16" rx="8" fill="#0B1F35" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.3"/>
    <text x="110" y="26" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">studyflow.amjs.app</text>

    <!-- App layout -->
    <!-- Sidebar -->
    <rect x="15" y="45" width="105" height="250" rx="8" fill="#0B1F35" opacity="0.7"/>
    <rect x="25" y="60" width="85" height="12" rx="4" fill="#22D3EE" opacity="0.8"/>
    <rect x="25" y="85" width="70" height="10" rx="3" fill="#38BDF8" opacity="0.4"/>
    <rect x="25" y="105" width="75" height="10" rx="3" fill="#38BDF8" opacity="0.4"/>
    <rect x="25" y="125" width="60" height="10" rx="3" fill="#38BDF8" opacity="0.4"/>
    <rect x="25" y="145" width="65" height="10" rx="3" fill="#38BDF8" opacity="0.4"/>

    <!-- Main Content Header -->
    <rect x="135" y="45" width="370" height="55" rx="8" fill="#0B1F35" opacity="0.5"/>
    <text x="150" y="70" fill="#F1F5F9" font-family="'Inter', sans-serif" font-size="14" font-weight="700">Engineering Study Dashboard</text>
    <text x="150" y="88" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="10">Sprint Progress &amp; Semester Milestones</text>

    <!-- 3 Cards -->
    <rect x="135" y="112" width="115" height="85" rx="8" fill="#0E2847" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.4"/>
    <text x="145" y="132" fill="#22D3EE" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Active Tasks</text>
    <text x="145" y="162" fill="#F1F5F9" font-family="'Inter', sans-serif" font-size="22" font-weight="800">14</text>
    <rect x="145" y="178" width="80" height="5" rx="2.5" fill="#22D3EE" opacity="0.7"/>

    <rect x="262" y="112" width="115" height="85" rx="8" fill="#0E2847" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.3"/>
    <text x="272" y="132" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Focus Hours</text>
    <text x="272" y="162" fill="#F1F5F9" font-family="'Inter', sans-serif" font-size="22" font-weight="800">38.5</text>
    <rect x="272" y="178" width="65" height="5" rx="2.5" fill="#38BDF8" opacity="0.7"/>

    <rect x="390" y="112" width="115" height="85" rx="8" fill="#0E2847" stroke="#22D3EE" stroke-width="1" stroke-opacity="0.3"/>
    <text x="400" y="132" fill="#22D3EE" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Completion</text>
    <text x="400" y="162" fill="#F1F5F9" font-family="'Inter', sans-serif" font-size="22" font-weight="800">92%</text>
    <rect x="400" y="178" width="90" height="5" rx="2.5" fill="#22D3EE" opacity="0.7"/>

    <!-- Bottom Chart / Table preview -->
    <rect x="135" y="210" width="370" height="85" rx="8" fill="#0B1F35" opacity="0.6"/>
    <!-- Simulated mini waveform / bars -->
    <rect x="155" y="250" width="18" height="35" rx="3" fill="#22D3EE" opacity="0.6"/>
    <rect x="185" y="235" width="18" height="50" rx="3" fill="#38BDF8" opacity="0.8"/>
    <rect x="215" y="242" width="18" height="43" rx="3" fill="#22D3EE" opacity="0.7"/>
    <rect x="245" y="228" width="18" height="57" rx="3" fill="#22D3EE" filter="url(#p1glow)"/>
    <rect x="275" y="248" width="18" height="37" rx="3" fill="#38BDF8" opacity="0.7"/>
    <rect x="305" y="238" width="18" height="47" rx="3" fill="#22D3EE" opacity="0.8"/>

    <text x="345" y="245" fill="#F1F5F9" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Smart Study Insights</text>
    <text x="345" y="265" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="9">Automated revision cycles &amp; priority scheduling</text>
  </g>
</svg>

